function renderGalleryTitle(){const title=(GALLERY_DATA.galleryTitle||'LAIKUSHOWROOM').trim();if(title.toUpperCase()==='LAIKUSHOWROOM'){galleryTitle.innerHTML='<span class="l">L</span>AIKU<span class="s">S</span>HOW<span class="r">R</span>OOM'}else galleryTitle.textContent=title}renderGalleryTitle();
let category='Összes',visibleItems=[],modalIndex=-1;const path=x=>`wallpapers/${x.folder}/${x.file}`;function renderCats(){const cs=['Összes',...GALLERY_DATA.themes.map(t=>t.name)];cats.innerHTML=cs.map(c=>`<button class="${c===category?'active':''}" data-cat="${encodeURIComponent(c)}">${c}</button>`).join('');cats.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=decodeURIComponent(b.dataset.cat);render()})}function render(){renderCats();const q=search.value.trim().toLowerCase(),v=GALLERY_DATA.wallpapers.filter(x=>(category==='Összes'||x.theme===category)&&(`${x.title} ${x.theme} ${x.file}`).toLowerCase().includes(q));visibleItems=v;grid.innerHTML=v.map(x=>`<article class="card"><img class="pic" src="${path(x)}" alt="${x.title}" data-id="${x.id}"><div class="info"><div><div class="title">${x.file.replace(/\.[^.]+$/,'')}</div><div class="file">${x.resolution||''}</div></div><button class="dl" data-dl="${x.id}">Letöltés</button></div></article>`).join('')||'<div class="empty">Még nincs háttérkép. Az admin.html felületen add hozzá a témákat és képeket.</div>';grid.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openModal(e.dataset.id));grid.querySelectorAll('[data-dl]').forEach(e=>e.onclick=()=>downloadItem(e.dataset.dl))}function item(id){return GALLERY_DATA.wallpapers.find(x=>x.id===id)}async function downloadItem(id){const x=item(id);try{const r=await fetch(path(x));if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){const a=document.createElement('a');a.href=path(x);a.download=x.file;document.body.appendChild(a);a.click();a.remove()}}function openModal(id){modalIndex=visibleItems.findIndex(x=>x.id===id);const x=item(id);modalImg.src=path(x);modalTitle.textContent=x.file.replace(/\.[^.]+$/,'');modalFile.textContent=x.resolution||'';modalDl.onclick=()=>downloadItem(id);modal.classList.add('open')}function stepModal(dir){if(!visibleItems.length)return;modalIndex=(modalIndex+dir+visibleItems.length)%visibleItems.length;openModal(visibleItems[modalIndex].id)}function closeModal(){modal.classList.remove('open')}document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='ArrowLeft')stepModal(-1);if(e.key==='ArrowRight')stepModal(1);if(e.key==='Escape')closeModal()});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});search.addEventListener('input',render);render();
</script></body></html>
